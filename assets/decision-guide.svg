<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">ComfyUI decision guide</title><desc id="desc">Three capability-specific decision and stop conditions for ComfyUI.</desc>
<rect width="1200" height="560" rx="26" fill="#F8FAFC"/><rect width="1200" height="14" rx="7" fill="#2563EB"/>
<style>text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
<text x="54" y="62" font-size="14" font-weight="750" fill="#2563EB" text-anchor="start"><tspan x="54" dy="0">DECISION AND STOP CONDITIONS</tspan></text><text x="54" y="110" font-size="31" font-weight="760" fill="#0F172A" text-anchor="start"><tspan x="54" dy="0">ComfyUI</tspan></text><polygon points="225,185 385,270 225,355 65,270" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/><text x="225" y="250" font-size="17" font-weight="700" fill="#172033" text-anchor="middle"><tspan x="225" dy="0">Is prompt and source</tspan><tspan x="225" dy="22">assets clearly scoped?</tspan></text><text x="170" y="385" font-size="13" font-weight="750" fill="#2563EB" text-anchor="start"><tspan x="170" dy="0">YES</tspan></text><rect x="70" y="405" width="250" height="80" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="92" y="440" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="92" dy="0">Inspect model and</tspan><tspan x="92" dy="23">sampler nodes</tspan></text><text x="340" y="385" font-size="13" font-weight="750" fill="#B42318" text-anchor="start"><tspan x="340" dy="0">NO</tspan></text><rect x="335" y="405" width="90" height="80" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="357" y="440" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="357" dy="0">Clarify</tspan><tspan x="357" dy="23">target</tspan></text><path d="M320 445 L445 270" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arr)"/><polygon points="605,185 765,270 605,355 445,270" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/><text x="605" y="250" font-size="17" font-weight="700" fill="#172033" text-anchor="middle"><tspan x="605" dy="0">Is access to conditioning</tspan><tspan x="605" dy="22">graph authorized?</tspan></text><text x="550" y="385" font-size="13" font-weight="750" fill="#2563EB" text-anchor="start"><tspan x="550" dy="0">YES</tspan></text><rect x="450" y="405" width="250" height="80" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="472" y="440" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="472" dy="0">Run gpu execution queue</tspan></text><text x="720" y="385" font-size="13" font-weight="750" fill="#B42318" text-anchor="start"><tspan x="720" dy="0">NO</tspan></text><rect x="715" y="405" width="90" height="80" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="737" y="440" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="737" dy="0">Stop at</tspan><tspan x="737" dy="23">boundary</tspan></text><path d="M700 445 L825 270" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arr)"/><polygon points="985,185 1145,270 985,355 825,270" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/><text x="985" y="250" font-size="17" font-weight="700" fill="#172033" text-anchor="middle"><tspan x="985" dy="0">Does image video or audio</tspan><tspan x="985" dy="22">output pass verification?</tspan></text><text x="930" y="385" font-size="13" font-weight="750" fill="#2563EB" text-anchor="start"><tspan x="930" dy="0">YES</tspan></text><rect x="830" y="405" width="250" height="80" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="852" y="440" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="852" dy="0">Deliver evidence</tspan></text><text x="1100" y="385" font-size="13" font-weight="750" fill="#B42318" text-anchor="start"><tspan x="1100" dy="0">NO</tspan></text><rect x="1095" y="405" width="90" height="80" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1117" y="440" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="1117" dy="0">Report</tspan><tspan x="1117" dy="23">incomplete</tspan></text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563EB"/></marker></defs></svg>